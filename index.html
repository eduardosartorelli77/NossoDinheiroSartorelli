<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Família Sartorelli 🌸</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #FDF2F8 0%, #F5F3FF 50%, #F0FDF4 100%);
    }
  </style>
</head>
<body class="text-slate-700 p-4 sm:p-8 min-h-screen">

  <div class="max-w-4xl mx-auto space-y-8" id="app">
    
    <!-- Cabeçalho -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white/80 backdrop-blur-md p-6 rounded-3xl shadow-sm border border-pink-100/60">
      <div>
        <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
          <span class="text-pink-400">💖</span> Família Sartorelli
        </h1>
        <p class="text-xs text-pink-400 mt-1 font-medium" id="status-conexao">Conectando ao Firebase...</p>
      </div>
      <div class="flex items-center gap-3">
        <!-- Filtro por Mês -->
        <div class="flex items-center gap-2 bg-gradient-to-r from-pink-50 to-purple-50 px-3 py-2 rounded-2xl border border-pink-100/80 shadow-xs hover:border-pink-300 transition cursor-pointer" onclick="document.getElementById('filter-month').showPicker()">
          <span class="text-sm">📅</span>
          <label for="filter-month" class="text-xs font-semibold text-pink-600 uppercase tracking-wider cursor-pointer">Mês:</label>
          <input 
            type="month" 
            id="filter-month" 
            onclick="this.showPicker()"
            class="bg-transparent text-sm font-medium text-slate-700 focus:outline-none cursor-pointer"
          >
        </div>
        <div class="hidden sm:flex items-center gap-1.5 bg-rose-100/60 text-rose-600 px-4 py-2.5 rounded-2xl text-sm font-medium border border-rose-200/50">
          <span>💕</span> Nosso Canto
        </div>
      </div>
    </header>

    <!-- Cards de Resumo -->
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
      <div class="bg-white/90 backdrop-blur-sm p-5 rounded-3xl shadow-sm border border-pink-100/50">
        <p class="text-[11px] text-pink-400 font-bold uppercase tracking-wider">Saldo do Mês</p>
        <p id="total-balance" class="text-2xl font-bold mt-2 text-slate-800">R$ 0,00</p>
      </div>
      <div class="bg-white/90 backdrop-blur-sm p-5 rounded-3xl shadow-sm border border-emerald-100/50">
        <p class="text-[11px] text-emerald-500 font-bold uppercase tracking-wider flex items-center gap-1">
          🌱 Receitas
        </p>
        <p id="total-income" class="text-2xl font-bold text-slate-800 mt-2">R$ 0,00</p>
      </div>
      <div class="bg-white/90 backdrop-blur-sm p-5 rounded-3xl shadow-sm border border-rose-100/50">
        <p class="text-[11px] text-rose-400 font-bold uppercase tracking-wider flex items-center gap-1">
          🌷 Despesas
        </p>
        <p id="total-expense" class="text-2xl font-bold text-slate-800 mt-2">R$ 0,00</p>
      </div>
      <div class="bg-white/90 backdrop-blur-sm p-5 rounded-3xl shadow-sm border border-amber-100/50">
        <p class="text-[11px] text-amber-500 font-bold uppercase tracking-wider flex items-center gap-1">
          🐾 Gastos com Gatos
        </p>
        <p id="total-cats" class="text-2xl font-bold text-slate-800 mt-2">R$ 0,00</p>
      </div>
    </div>

    <!-- Formulário de Adição / Edição -->
    <div class="bg-white/90 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-pink-100/60">
      <h2 id="form-title" class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
        <span class="text-pink-400">✨</span> Novo Lançamento
      </h2>
      <form id="transaction-form" class="grid grid-cols-1 sm:grid-cols-6 gap-3">
        <input type="hidden" id="editing-id" value="">
        
        <div class="sm:col-span-2">
          <label class="text-xs font-medium text-slate-500 mb-1 block">Descrição</label>
          <input 
            type="text" 
            id="description" 
            placeholder="Ex: Conta de Luz, Ração..." 
            class="w-full px-4 py-2.5 rounded-2xl border border-pink-100 bg-pink-50/20 focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm"
            required
          />
        </div>

        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">Valor (R$)</label>
          <input 
            type="number" 
            step="0.01" 
            id="amount" 
            placeholder="0,00" 
            class="w-full px-4 py-2.5 rounded-2xl border border-pink-100 bg-pink-50/20 focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm"
            required
          />
        </div>

        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">Tipo</label>
          <select 
            id="type" 
            onchange="handleTypeChange()"
            class="w-full px-4 py-2.5 rounded-2xl border border-pink-100 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm"
          >
            <option value="expense">Despesa</option>
            <option value="income">Receita</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">Categoria</label>
          <select 
            id="category" 
            class="w-full px-4 py-2.5 rounded-2xl border border-pink-100 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm"
          >
            <!-- Preenchido via script -->
          </select>
        </div>

        <!-- Seletor de pessoa (Receitas) -->
        <div id="person-container" class="hidden">
          <label class="text-xs font-medium text-slate-500 mb-1 block">Quem Recebeu?</label>
          <select 
            id="person" 
            class="w-full px-4 py-2.5 rounded-2xl border border-pink-100 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm"
          >
            <option value="Ambos">Ambos</option>
            <option value="Marido">Marido</option>
            <option value="Esposa">Esposa</option>
          </select>
        </div>

        <!-- Campo de Vencimento -->
        <div id="date-container" class="sm:col-span-3">
          <label for="dueDate" class="text-xs font-medium text-slate-500 mb-1 block">Vencimento</label>
          <input 
            type="date" 
            id="dueDate" 
            onclick="this.showPicker()"
            class="w-full px-4 py-2.5 rounded-2xl border border-pink-100 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm cursor-pointer"
            required
          />
        </div>

        <!-- Opção de Pago -->
        <div id="paid-container" class="sm:col-span-3 flex items-center justify-start px-4 py-2.5 rounded-2xl border border-pink-100 bg-pink-50/30 self-end">
          <div class="flex items-center gap-2">
            <input type="checkbox" id="isPaid" class="w-4 h-4 text-emerald-500 rounded border-pink-200 focus:ring-emerald-300 accent-emerald-500">
            <label for="isPaid" class="text-xs font-medium text-slate-700 cursor-pointer">Pago</label>
          </div>
        </div>

        <div class="sm:col-span-6 flex items-center gap-2 mt-2">
          <button 
            type="submit" 
            id="btn-submit"
            class="flex-1 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-semibold py-3 rounded-2xl transition text-sm flex items-center justify-center gap-2 shadow-sm cursor-pointer"
          >
            Guardar Lançamento 🌸
          </button>
          <button 
            type="button" 
            id="btn-cancel-edit"
            onclick="cancelEdit()"
            class="hidden bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-3 px-6 rounded-2xl transition text-sm cursor-pointer"
          >
            Cancelar
          </button>
        </div>
      </form>
    </div>

    <!-- Lista de Transações -->
    <div class="bg-white/90 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-pink-100/60">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-slate-800">Contas do Mês</h2>
        <span class="text-xs text-pink-400 font-medium bg-pink-50 px-3 py-1 rounded-full border border-pink-100">Ordenado por Vencimento</span>
      </div>
      <div id="transactions-list" class="space-y-3">
        <p class="text-slate-400 text-center py-6 text-sm">Carregando dados da nuvem...</p>
      </div>
    </div>

  </div>

  <!-- Scripts do Firebase v10 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚙️ SUBSTITUA COM AS SUAS CONFIGURAÇÕES DO FIREBASE
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "seu-projeto.firebaseapp.com",
      projectId: "seu-projeto-id",
      storageBucket: "seu-projeto.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('status-conexao').innerText = 'Sincronizado ✨';

    // Definir o mês atual no filtro
    const now = new Date();
    const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    document.getElementById('filter-month').value = currentYearMonth;
    
    // Data de vencimento padrão para hoje
    document.getElementById('dueDate').value = now.toISOString().split('T')[0];

    const categoriesMap = {
      expense: [
        '💧 Água', 
        '⚡ Luz', 
        '🔥 Gás', 
        '🌐 Internet/TV', 
        '🏠 Aluguel/Condomínio', 
        '🛒 Mercado/Alimentação',
        '🐾 Gatos', 
        '🚗 Transporte', 
        '🌷 Lazer & Casal', 
        '📦 Outros'
      ],
      income: ['Salário', 'Freelance', 'Investimentos', 'Outros']
    };

    window.handleTypeChange = function() {
      const type = document.getElementById('type').value;
      const categorySelect = document.getElementById('category');
      const personContainer = document.getElementById('person-container');
      const paidContainer = document.getElementById('paid-container');
      const dateContainer = document.getElementById('date-container');
      const isPaidCheckbox = document.getElementById('isPaid');

      categorySelect.innerHTML = '';
      categoriesMap[type].forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });

      if (type === 'income') {
        personContainer.classList.remove('hidden');
        paidContainer.classList.add('hidden');
        dateContainer.className = "sm:col-span-3";
        isPaidCheckbox.checked = true;
      } else {
        personContainer.classList.add('hidden');
        paidContainer.classList.remove('hidden');
        dateContainer.className = "sm:col-span-3";
        isPaidCheckbox.checked = false;
      }
    };
    window.handleTypeChange();

    // Ler dados do Firestore
    let allTransactions = [];
    const q = query(collection(db, 'transactions'), orderBy('dueDate', 'asc'));
    
    onSnapshot(q, (snapshot) => {
      allTransactions = [];
      snapshot.forEach((docSnap) => {
        allTransactions.push({ id: docSnap.id, ...docSnap.data() });
      });
      filterAndRenderApp();
    }, (error) => {
      console.error("Erro ao carregar dados:", error);
      document.getElementById('transactions-list').innerHTML = '<p class="text-rose-400 text-center py-6 text-sm">Erro ao conectar ao Firestore.</p>';
    });

    document.getElementById('filter-month').addEventListener('change', filterAndRenderApp);

    function filterAndRenderApp() {
      const selectedMonth = document.getElementById('filter-month').value;
      
      const filtered = allTransactions.filter(t => {
        if (!t.dueDate) return false;
        return t.dueDate.startsWith(selectedMonth);
      });

      // Ordenar por Vencimento (mais próximo primeiro)
      filtered.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));

      renderApp(filtered);
    }

    // Salvar ou Atualizar transação
    document.getElementById('transaction-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editingId = document.getElementById('editing-id').value;
      const description = document.getElementById('description').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const type = document.getElementById('type').value;
      const category = document.getElementById('category').value;
      const person = type === 'income' ? document.getElementById('person').value : 'Nosso Lar';
      const dueDate = document.getElementById('dueDate').value;
      const isPaid = type === 'income' ? true : document.getElementById('isPaid').checked;

      try {
        if (editingId) {
          // Atualizar conta existente
          const docRef = doc(db, 'transactions', editingId);
          await updateDoc(docRef, {
            description,
            amount,
            type,
            category,
            person,
            dueDate,
            isPaid
          });
        } else {
          // Adicionar nova conta
          await addDoc(collection(db, 'transactions'), {
            description,
            amount,
            type,
            category,
            person,
            dueDate,
            isPaid,
            createdAt: new Date().toISOString()
          });
        }

        // LIMPEZA GARANTIDA DOS CAMPOS
        cancelEdit();

      } catch (err) {
        console.error("Erro ao salvar:", err);
        alert("Erro ao salvar lançamento.");
      }
    });

    // Iniciar edição
    window.startEditTransaction = function(id) {
      const t = allTransactions.find(item => item.id === id);
      if (!t) return;

      document.getElementById('editing-id').value = t.id;
      document.getElementById('description').value = t.description;
      document.getElementById('amount').value = t.amount;
      document.getElementById('type').value = t.type;
      
      handleTypeChange();

      document.getElementById('category').value = t.category;
      if (t.type === 'income' && t.person) {
        document.getElementById('person').value = t.person;
      }
      document.getElementById('dueDate').value = t.dueDate;
      document.getElementById('isPaid').checked = !!t.isPaid;

      // Alterar UI para modo edição
      document.getElementById('form-title').innerHTML = '<span class="text-amber-500">✏️</span> Editar Lançamento';
      document.getElementById('btn-submit').innerText = 'Atualizar Lançamento 🌸';
      document.getElementById('btn-cancel-edit').classList.remove('hidden');

      // Scroll até o formulário
      document.getElementById('transaction-form').scrollIntoView({ behavior: 'smooth' });
    };

    // Reseta o formulário e limpa todos os campos
    window.cancelEdit = function() {
      document.getElementById('editing-id').value = '';
      document.getElementById('description').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('type').value = 'expense';
      document.getElementById('dueDate').value = new Date().toISOString().split('T')[0];

      document.getElementById('form-title').innerHTML = '<span class="text-pink-400">✨</span> Novo Lançamento';
      document.getElementById('btn-submit').innerText = 'Guardar Lançamento 🌸';
      document.getElementById('btn-cancel-edit').classList.add('hidden');

      handleTypeChange();
    };

    window.togglePaidStatus = async function(id, currentStatus) {
      try {
        const docRef = doc(db, 'transactions', id);
        await updateDoc(docRef, { isPaid: !currentStatus });
      } catch (err) {
        console.error("Erro ao atualizar status:", err);
      }
    };

    window.deleteTransaction = async function(id) {
      if (confirm("Deseja apagar este lançamento?")) {
        try {
          await deleteDoc(doc(db, 'transactions', id));
          if (document.getElementById('editing-id').value === id) {
            cancelEdit();
          }
        } catch (err) {
          console.error("Erro ao excluir:", err);
        }
      }
    };

    function renderApp(transactions) {
      const listEl = document.getElementById('transactions-list');
      
      let totalIncome = 0;
      let totalExpense = 0;
      let catExpense = 0;

      transactions.forEach(t => {
        if (t.type === 'income') totalIncome += t.amount;
        if (t.type === 'expense') {
          totalExpense += t.amount;
          if (t.category.includes('Gatos')) catExpense += t.amount;
        }
      });

      const balance = totalIncome - totalExpense;

      // Atualizar Cards
      document.getElementById('total-balance').innerText = `R$ ${balance.toFixed(2)}`;
      document.getElementById('total-balance').className = `text-2xl font-bold mt-2 ${balance >= 0 ? 'text-slate-800' : 'text-rose-500'}`;
      document.getElementById('total-income').innerText = `R$ ${totalIncome.toFixed(2)}`;
      document.getElementById('total-expense').innerText = `R$ ${totalExpense.toFixed(2)}`;
      document.getElementById('total-cats').innerText = `R$ ${catExpense.toFixed(2)}`;

      if (transactions.length === 0) {
        listEl.innerHTML = '<p class="text-slate-400 text-center py-8 text-sm">Sem contas cadastradas para este mês. 🌸</p>';
        return;
      }

      listEl.innerHTML = transactions.map(t => {
        const isCat = t.category.includes('Gatos');
        const isInc = t.type === 'income';
        const iconBg = isCat ? 'bg-amber-50 text-amber-600 border-amber-100' : isInc ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-pink-50 text-pink-500 border-pink-100';
        
        const [year, month, day] = t.dueDate.split('-');
        const formattedDate = `${day}/${month}/${year}`;

        return `
          <div class="flex items-center justify-between p-4 rounded-2xl border transition ${t.isPaid ? 'border-pink-50 bg-white/60' : 'border-rose-200 bg-rose-50/20 shadow-xs'} hover:shadow-md">
            <div class="flex items-center gap-3.5">
              ${!isInc ? `
                <button onclick="togglePaidStatus('${t.id}', ${t.isPaid})" class="w-6 h-6 rounded-lg border flex items-center justify-center transition cursor-pointer ${t.isPaid ? 'bg-emerald-400 border-emerald-400 text-white' : 'border-pink-200 bg-white hover:border-pink-400'}" title="Marcar como Pago">
                  ${t.isPaid ? '✓' : ''}
                </button>
              ` : ''}
              <div class="w-10 h-10 rounded-2xl border flex items-center justify-center text-lg ${iconBg}">
                ${isInc ? '🌸' : t.category.split(' ')[0]}
              </div>
              <div>
                <p class="font-medium text-slate-800 text-sm ${t.isPaid && t.type === 'expense' ? 'line-through text-slate-400' : ''}">${t.description}</p>
                <div class="flex items-center gap-2 mt-0.5 flex-wrap">
                  <span class="text-[11px] bg-pink-50/80 text-pink-600 px-2 py-0.5 rounded-md font-medium border border-pink-100/50">${t.category}</span>
                  ${t.type === 'income' ? `<span class="text-xs text-slate-400">• ${t.person}</span>` : ''}
                  <span class="text-xs ${t.isPaid ? 'text-slate-400' : 'text-rose-500 font-medium'}">• Venc: ${formattedDate}</span>
                </div>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-bold text-sm ${isInc ? 'text-emerald-500' : 'text-slate-700'}">
                ${isInc ? '+' : '-'} R$ ${t.amount.toFixed(2)}
              </span>
              <button onclick="startEditTransaction('${t.id}')" class="text-slate-400 hover:text-amber-500 transition p-1 cursor-pointer" title="Editar Lançamento">
                ✏️
              </button>
              <button onclick="deleteTransaction('${t.id}')" class="text-slate-300 hover:text-rose-400 transition p-1 cursor-pointer" title="Excluir Lançamento">
                🗑️
              </button>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
