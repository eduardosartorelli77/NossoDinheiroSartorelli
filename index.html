<!-- ... existing code ... -->
  <title>Família Sartorelli 🌸</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js para o gráfico de pizza -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #FDF2F8 0%, #F5F3FF 50%, #F0FDF4 100%);
    }
  </style>
</head>
<body class="text-slate-700 p-4 sm:p-8 min-h-screen">

  <!-- ==================== TELA DE LOGIN ==================== -->
<!-- ... existing code ... -->

    <!-- Cards de Resumo -->
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
      <div class="bg-white/90 backdrop-blur-sm p-5 rounded-3xl shadow-sm border border-pink-100/50">
        <p class="text-[11px] text-pink-400 font-bold uppercase tracking-wider">Saldo do Mês (PAGO)</p>
        <p id="total-balance" class="text-2xl font-bold mt-2 text-slate-800">R$ 0,00</p>
      </div>
      <div class="bg-white/90 backdrop-blur-sm p-5 rounded-3xl shadow-sm border border-emerald-100/50">
        <p class="text-[11px] text-emerald-500 font-bold uppercase tracking-wider flex items-center gap-1">
          🌱 Receitas
        </p>
        <p id="total-income" class="text-2xl font-bold text-slate-800 mt-2">R$ 0,00</p>
      </div>
      <div class="bg-white/90 backdrop-blur-sm p-5 rounded-3xl shadow-sm border border-rose-100/50">
        <p class="text-[11px] text-rose-400 font-bold uppercase tracking-wider flex items-center gap-1">
          🌷 Despesas Pagas
        </p>
        <p id="total-expense" class="text-2xl font-bold text-slate-800 mt-2">R$ 0,00</p>
      </div>
      <div class="bg-white/90 backdrop-blur-sm p-5 rounded-3xl shadow-sm border border-amber-100/50">
        <p class="text-[11px] text-amber-500 font-bold uppercase tracking-wider flex items-center gap-1">
          ⏳ Despesas Pendentes
        </p>
        <p id="total-pending" class="text-2xl font-bold text-slate-800 mt-2">R$ 0,00</p>
      </div>
    </div>

    <!-- Navegação por Abas (Lista / Gráfico) -->
    <div class="flex items-center gap-2 border-b border-pink-100/60 pb-2">
      <button 
        id="tab-btn-list" 
        onclick="switchTab('list')" 
        class="px-5 py-2.5 rounded-2xl text-sm font-semibold transition bg-gradient-to-r from-pink-400 to-rose-400 text-white shadow-xs cursor-pointer flex items-center gap-2"
      >
        <span>📋</span> Lista de Contas
      </button>
      <button 
        id="tab-btn-chart" 
        onclick="switchTab('chart')" 
        class="px-5 py-2.5 rounded-2xl text-sm font-medium transition bg-white/70 hover:bg-white text-slate-600 border border-pink-100 cursor-pointer flex items-center gap-2"
      >
        <span>📊</span> Gráficos
      </button>
    </div>

    <!-- Formulário de Adição / Edição -->
    <div id="section-form" class="bg-white/90 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-pink-100/60">
<!-- ... existing code ... -->
        <div>
          <label class="text-xs font-medium text-slate-500 mb-1 block">Categoria</label>
          <select 
            id="category" 
            class="w-full px-4 py-2.5 rounded-2xl border border-pink-100 bg-white focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm"
          >
            <!-- Preenchido via script -->
          </select>
        </div>
<!-- ... existing code ... -->
    <!-- Conteúdo da Aba 1: Lista de Transações -->
    <div id="tab-content-list" class="bg-white/90 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-pink-100/60">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-slate-800">Contas do Mês</h2>
        <span class="text-xs text-pink-400 font-medium bg-pink-50 px-3 py-1 rounded-full border border-pink-100">Ordenado por Vencimento</span>
      </div>
      <div id="transactions-list" class="space-y-3">
        <p class="text-slate-400 text-center py-6 text-sm">Carregando dados da nuvem...</p>
      </div>
    </div>

    <!-- Conteúdo da Aba 2: Gráfico em Pizza -->
    <div id="tab-content-chart" class="bg-white/90 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-pink-100/60 hidden">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h2 class="text-lg font-semibold text-slate-800">Distribuição de Despesas Pagas</h2>
          <p class="text-xs text-slate-400 mt-0.5">Gráfico por categoria referente às contas marcadas como saldas</p>
        </div>
      </div>
      
      <div class="relative w-full max-w-md mx-auto aspect-square flex items-center justify-center p-2">
        <canvas id="expenseChart"></canvas>
      </div>

      <div id="chart-legend-container" class="mt-6 grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
        <!-- Legendas geradas via JS -->
      </div>
    </div>

  </div>

  <!-- Scripts do Firebase v10 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuração oficial do seu Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBT4qMawtbY1ZmPJoqCrxJzZX0aP2cnKIw",
      authDomain: "nossodinheirosartorelli.firebaseapp.com",
      projectId: "nossodinheirosartorelli",
      storageBucket: "nossodinheirosartorelli.firebasestorage.app",
      messagingSenderId: "552307426877",
      appId: "1:552307426877:web:14e876a033ed53ce814c54",
      measurementId: "G-BEH83YNTPZ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app');
    const loginError = document.getElementById('login-error');

    let unsubscribeFirestore = null;
    let chartInstance = null;
    let currentTab = 'list';

    // Gerenciador de Abas
    window.switchTab = function(tab) {
      currentTab = tab;
      const btnList = document.getElementById('tab-btn-list');
      const btnChart = document.getElementById('tab-btn-chart');
      const contentList = document.getElementById('tab-content-list');
      const contentChart = document.getElementById('tab-content-chart');
      const sectionForm = document.getElementById('section-form');

      if (tab === 'list') {
        btnList.className = "px-5 py-2.5 rounded-2xl text-sm font-semibold transition bg-gradient-to-r from-pink-400 to-rose-400 text-white shadow-xs cursor-pointer flex items-center gap-2";
        btnChart.className = "px-5 py-2.5 rounded-2xl text-sm font-medium transition bg-white/70 hover:bg-white text-slate-600 border border-pink-100 cursor-pointer flex items-center gap-2";
        contentList.classList.remove('hidden');
        contentChart.classList.add('hidden');
        sectionForm.classList.remove('hidden');
      } else {
        btnChart.className = "px-5 py-2.5 rounded-2xl text-sm font-semibold transition bg-gradient-to-r from-pink-400 to-rose-400 text-white shadow-xs cursor-pointer flex items-center gap-2";
        btnList.className = "px-5 py-2.5 rounded-2xl text-sm font-medium transition bg-white/70 hover:bg-white text-slate-600 border border-pink-100 cursor-pointer flex items-center gap-2";
        contentChart.classList.remove('hidden');
        contentList.classList.add('hidden');
        sectionForm.classList.add('hidden');
        renderChart();
      }
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
        initApp();
      } else {
        loginScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
        if (unsubscribeFirestore) unsubscribeFirestore();
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      loginError.classList.add('hidden');

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        console.error("Erro no login:", err);
        loginError.innerText = "E-mail ou senha incorretos. Tente novamente.";
        loginError.classList.remove('hidden');
      }
    });

    document.getElementById('btn-logout').addEventListener('click', async () => {
      await signOut(auth);
    });

    function initApp() {
      const now = new Date();
      const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      document.getElementById('filter-month').value = currentYearMonth;
      document.getElementById('dueDate').value = now.toISOString().split('T')[0];

      const q = query(collection(db, 'transactions'), orderBy('dueDate', 'asc'));
      
      unsubscribeFirestore = onSnapshot(q, (snapshot) => {
        allTransactions = [];
        snapshot.forEach((docSnap) => {
          allTransactions.push({ id: docSnap.id, ...docSnap.data() });
        });
        filterAndRenderApp();
      }, (error) => {
        console.error("Erro ao carregar dados:", error);
        document.getElementById('transactions-list').innerHTML = '<p class="text-rose-400 text-center py-6 text-sm">Erro ao conectar ao Firestore.</p>';
      });
    }

    // LISTA DE CATEGORIAS ATUALIZADA
    const categoriesMap = {
      expense: [
        'Contas de Consumo',
        'Moradia',
        'Mercado',
        'Alimentação',
        'Educação',
        'Lazer',
        'Carro',
        'Saúde',
        'Outros'
      ],
      income: ['Salário', 'Freelance', 'Investimentos', 'Outros']
    };

    const categoryIcons = {
      'Contas de Consumo': '⚡',
      'Moradia': '🏠',
      'Mercado': '🛒',
      'Alimentação': '🍽️',
      'Educação': '📚',
      'Lazer': '🌷',
      'Carro': '🚗',
      'Saúde': '🩺',
      'Outros': '📦',
      'Salário': '💵',
      'Freelance': '💻',
      'Investimentos': '📈'
    };

    window.handleTypeChange = function() {
      const type = document.getElementById('type').value;
      const categorySelect = document.getElementById('category');
      const personContainer = document.getElementById('person-container');
      const paidContainer = document.getElementById('paid-container');
      const dateContainer = document.getElementById('date-container');
      const isPaidCheckbox = document.getElementById('isPaid');

      categorySelect.innerHTML = '';
      categoriesMap[type].forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = `${categoryIcons[cat] || '📦'} ${cat}`;
        categorySelect.appendChild(option);
      });

      if (type === 'income') {
        personContainer.classList.remove('hidden');
        paidContainer.classList.add('hidden');
        dateContainer.className = "sm:col-span-3";
        isPaidCheckbox.checked = true;
      } else {
        personContainer.classList.add('hidden');
        paidContainer.classList.remove('hidden');
        dateContainer.className = "sm:col-span-3";
        isPaidCheckbox.checked = false;
      }
    };
    window.handleTypeChange();

    let allTransactions = [];
    let currentFilteredTransactions = [];

    document.getElementById('filter-month').addEventListener('change', filterAndRenderApp);

    function filterAndRenderApp() {
      const selectedMonth = document.getElementById('filter-month').value;
      
      currentFilteredTransactions = allTransactions.filter(t => {
        if (!t.dueDate) return false;
        return t.dueDate.startsWith(selectedMonth);
      });

      currentFilteredTransactions.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));

      renderApp(currentFilteredTransactions);
      if (currentTab === 'chart') {
        renderChart();
      }
    }

    document.getElementById('transaction-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editingId = document.getElementById('editing-id').value;
      const description = document.getElementById('description').value;
      const amount = parseFloat(document.getElementById('amount').value);
      const type = document.getElementById('type').value;
      const category = document.getElementById('category').value;
      const person = type === 'income' ? document.getElementById('person').value : 'Nosso Lar';
      const dueDate = document.getElementById('dueDate').value;
      const isPaid = type === 'income' ? true : document.getElementById('isPaid').checked;

      try {
        if (editingId) {
          const docRef = doc(db, 'transactions', editingId);
          await updateDoc(docRef, {
            description,
            amount,
            type,
            category,
            person,
            dueDate,
            isPaid
          });
        } else {
          await addDoc(collection(db, 'transactions'), {
            description,
            amount,
            type,
            category,
            person,
            dueDate,
            isPaid,
            createdAt: new Date().toISOString()
          });
        }

        cancelEdit();

      } catch (err) {
        console.error("Erro ao salvar:", err);
        alert("Erro ao salvar lançamento.");
      }
    });

    window.startEditTransaction = function(id) {
      const t = allTransactions.find(item => item.id === id);
      if (!t) return;

      document.getElementById('editing-id').value = t.id;
      document.getElementById('description').value = t.description;
      document.getElementById('amount').value = t.amount;
      document.getElementById('type').value = t.type;
      
      handleTypeChange();

      document.getElementById('category').value = t.category;
      if (t.type === 'income' && t.person) {
        document.getElementById('person').value = t.person;
      }
      document.getElementById('dueDate').value = t.dueDate;
      document.getElementById('isPaid').checked = !!t.isPaid;

      document.getElementById('form-title').innerHTML = '<span class="text-amber-500">✏️</span> Editar Lançamento';
      document.getElementById('btn-submit').innerText = 'Atualizar Lançamento 🌸';
      document.getElementById('btn-cancel-edit').classList.remove('hidden');

      if (currentTab === 'chart') switchTab('list');
      document.getElementById('transaction-form').scrollIntoView({ behavior: 'smooth' });
    };

    window.cancelEdit = function() {
      document.getElementById('editing-id').value = '';
      document.getElementById('description').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('type').value = 'expense';
      document.getElementById('dueDate').value = new Date().toISOString().split('T')[0];

      document.getElementById('form-title').innerHTML = '<span class="text-pink-400">✨</span> Novo Lançamento';
      document.getElementById('btn-submit').innerText = 'Guardar Lançamento 🌸';
      document.getElementById('btn-cancel-edit').classList.add('hidden');

      handleTypeChange();
    };

    window.togglePaidStatus = async function(id, currentStatus) {
      try {
        const docRef = doc(db, 'transactions', id);
        await updateDoc(docRef, { isPaid: !currentStatus });
      } catch (err) {
        console.error("Erro ao atualizar status:", err);
      }
    };

    window.deleteTransaction = async function(id) {
      if (confirm("Deseja apagar este lançamento?")) {
        try {
          await deleteDoc(doc(db, 'transactions', id));
          if (document.getElementById('editing-id').value === id) {
            cancelEdit();
          }
        } catch (err) {
          console.error("Erro ao excluir:", err);
        }
      }
    };

    function renderApp(transactions) {
      const listEl = document.getElementById('transactions-list');
      
      let totalIncome = 0;
      let totalExpense = 0; // APENAS PAGAS
      let totalPending = 0; // PENDENTES

      transactions.forEach(t => {
        if (t.type === 'income') {
          totalIncome += t.amount;
        } else if (t.type === 'expense') {
          if (t.isPaid) {
            totalExpense += t.amount; // Contabiliza apenas despesas pagas
          } else {
            totalPending += t.amount;
          }
        }
      });

      const balance = totalIncome - totalExpense;

      // Atualizar Cards
      document.getElementById('total-balance').innerText = `R$ ${balance.toFixed(2)}`;
      document.getElementById('total-balance').className = `text-2xl font-bold mt-2 ${balance >= 0 ? 'text-slate-800' : 'text-rose-500'}`;
      document.getElementById('total-income').innerText = `R$ ${totalIncome.toFixed(2)}`;
      document.getElementById('total-expense').innerText = `R$ ${totalExpense.toFixed(2)}`;
      document.getElementById('total-pending').innerText = `R$ ${totalPending.toFixed(2)}`;

      if (transactions.length === 0) {
        listEl.innerHTML = '<p class="text-slate-400 text-center py-8 text-sm">Sem contas cadastradas para este mês. 🌸</p>';
        return;
      }

      listEl.innerHTML = transactions.map(t => {
        const isInc = t.type === 'income';
        const iconSymbol = categoryIcons[t.category] || (isInc ? '🌸' : '📦');
        const iconBg = isInc ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : t.isPaid ? 'bg-pink-50 text-pink-500 border-pink-100' : 'bg-rose-50 text-rose-400 border-rose-100';
        
        const [year, month, day] = t.dueDate.split('-');
        const formattedDate = `${day}/${month}/${year}`;

        return `
          <div class="flex items-center justify-between p-4 rounded-2xl border transition ${t.isPaid ? 'border-pink-50 bg-white/60' : 'border-rose-200 bg-rose-50/20 shadow-xs'} hover:shadow-md">
            <div class="flex items-center gap-3.5">
              ${!isInc ? `
                <button onclick="togglePaidStatus('${t.id}', ${t.isPaid})" class="w-6 h-6 rounded-lg border flex items-center justify-center transition cursor-pointer ${t.isPaid ? 'bg-emerald-400 border-emerald-400 text-white' : 'border-pink-200 bg-white hover:border-pink-400'}" title="Marcar como Pago">
                  ${t.isPaid ? '✓' : ''}
                </button>
              ` : ''}
              <div class="w-10 h-10 rounded-2xl border flex items-center justify-center text-lg ${iconBg}">
                ${iconSymbol}
              </div>
              <div>
                <p class="font-medium text-slate-800 text-sm ${t.isPaid && t.type === 'expense' ? 'line-through text-slate-400' : ''}">${t.description}</p>
                <div class="flex items-center gap-2 mt-0.5 flex-wrap">
                  <span class="text-[11px] bg-pink-50/80 text-pink-600 px-2 py-0.5 rounded-md font-medium border border-pink-100/50">${t.category}</span>
                  ${t.type === 'income' ? `<span class="text-xs text-slate-400">• ${t.person}</span>` : ''}
                  <span class="text-xs ${t.isPaid ? 'text-slate-400' : 'text-rose-500 font-medium'}">• Venc: ${formattedDate} ${!t.isPaid && !isInc ? '(Pendente)' : ''}</span>
                </div>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-bold text-sm ${isInc ? 'text-emerald-500' : 'text-slate-700'}">
                ${isInc ? '+' : '-'} R$ ${t.amount.toFixed(2)}
              </span>
              <button onclick="startEditTransaction('${t.id}')" class="text-slate-400 hover:text-amber-500 transition p-1 cursor-pointer" title="Editar Lançamento">
                ✏️
              </button>
              <button onclick="deleteTransaction('${t.id}')" class="text-slate-300 hover:text-rose-400 transition p-1 cursor-pointer" title="Excluir Lançamento">
                🗑️
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // RENDERIZAÇÃO DO GRÁFICO DE PIZZA
    function renderChart() {
      const ctx = document.getElementById('expenseChart');
      if (!ctx) return;

      // Filtrar apenas despesas PAGAS do mês atual
      const paidExpenses = currentFilteredTransactions.filter(t => t.type === 'expense' && t.isPaid);

      const categoryTotals = {};
      paidExpenses.forEach(t => {
        categoryTotals[t.category] = (categoryTotals[t.category] || 0) + t.amount;
      });

      const labels = Object.keys(categoryTotals);
      const data = Object.values(categoryTotals);

      // Cores Pastel Suaves
      const paletteColors = [
        '#F472B6', // Rosa
        '#A78BFA', // Roxo
        '#34D399', // Menta
        '#FBBF24', // Âmbar
        '#60A5FA', // Azul
        '#F87171', // Coral
        '#F43F5E', // Rose
        '#C084FC', // Violeta
        '#9CA3AF'  // Cinza
      ];

      const legendContainer = document.getElementById('chart-legend-container');

      if (labels.length === 0) {
        if (chartInstance) chartInstance.destroy();
        legendContainer.innerHTML = '<p class="col-span-full text-slate-400 text-center py-4">Nenhuma despesa paga registrada para este mês.</p>';
        return;
      }

      const colors = labels.map((_, idx) => paletteColors[idx % paletteColors.length]);

      // Atualiza legendas personalizadas
      const totalSum = data.reduce((a, b) => a + b, 0);
      legendContainer.innerHTML = labels.map((label, idx) => {
        const val = data[idx];
        const pct = ((val / totalSum) * 100).toFixed(1);
        return `
          <div class="flex items-center gap-2 p-2.5 rounded-2xl bg-slate-50/70 border border-slate-100">
            <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${colors[idx]}"></span>
            <div class="truncate">
              <span class="font-medium text-slate-700 block truncate">${label}</span>
              <span class="text-[11px] text-slate-400">R$ ${val.toFixed(2)} (${pct}%)</span>
            </div>
          </div>
        `;
      }).join('');

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: colors,
            borderWidth: 2,
            borderColor: '#ffffff',
            hoverOffset: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false // Usamos a legenda customizada abaixo
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const val = context.raw || 0;
                  return ` ${context.label}: R$ ${val.toFixed(2)}`;
                }
              }
            }
          },
          cutout: '65%'
        }
      });
    }
  </script>
</body>
</html>
